    <script>
window.ACHIVILY_DEVICE_PAGE = "";
(function () {
  var current = window.ACHIVILY_DEVICE_PAGE;
  var path = window.location.pathname.toLowerCase();
  var params = new URLSearchParams(window.location.search);
  var forced = params.get("view");
  if (current && (forced === "mobile" || forced === "desktop")) return;

  function chooseDevice() {
    var viewport = Math.min(window.innerWidth || 9999, screen.width || 9999);
    var coarse = window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches;
    var narrow = window.matchMedia && window.matchMedia("(max-width: 760px)").matches;
    var uaMobile = /Android|iPhone|iPod|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent);
    return narrow || viewport <= 760 || (coarse && viewport <= 1024) || (uaMobile && viewport <= 900) ? "mobile" : "desktop";
  }

  function targetUrl(device) {
    var file = device === "mobile" ? "mobile.html" : "desktop.html";
    return file + window.location.search + window.location.hash;
  }

  var device = !current && (forced === "mobile" || forced === "desktop") ? forced : chooseDevice();
  document.documentElement.dataset.device = device;

  if (!current) {
    window.location.replace(targetUrl(device));
    return;
  }

  if (current !== device && !path.endsWith("/" + device + ".html")) {
    window.location.replace(targetUrl(device));
  }
})();
</script>
